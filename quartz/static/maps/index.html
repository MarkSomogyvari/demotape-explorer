<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Interactive Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: Arial, sans-serif;
}
#map {
  width: 65%;
  height: 100%;
}
#panel {
  width: 35%;
  padding: 15px;
  overflow-y: auto;
  border-left: 2px solid #ccc;
}
img {
  max-width: 100%;
}
iframe {
  width: 100%;
  height: 250px;
}
a {
  text-decoration: none;
  color: #284b63;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="panel">
  <h2>Welcome</h2>
  <p>Click a marker to load content.</p>
</div>

<script>
/**
 * Automatically detect repo base path.
 * Works both locally and on GitHub Pages.
 */
const repoBase = "/" + window.location.pathname.split('/')[1]; // e.g., "/demotape-explorer"

const map = L.map('map').setView([0,0], 12);

// Raster tiles
L.tileLayer(`${repoBase}/tiles/{z}/{x}/{y}.png`, {
  minZoom: 8,
  maxZoom: 16,
  noWrap: true
}).addTo(map);

let activeMarker = null;

// Load GeoJSON points
fetch(`${repoBase}/data/points-ai.geojson?v=${Date.now()}`)
  .then(res => res.json())
  .then(data => {
    const geoLayer = L.geoJSON(data, {
      pointToLayer: (feature, latlng) => L.marker(latlng),
      onEachFeature: (feature, layer) => {
        layer.on('click', () => {
          // Highlight marker
          if (activeMarker) activeMarker.getElement().classList.remove('active');
          activeMarker = layer;
          layer.getElement().classList.add('active');

          // Load Markdown content
          fetch(`${repoBase}/${feature.properties.content_file}?v=${Date.now()}`)
            .then(r => r.text())
            .then(md => {
              let html = marked.parse(md);

              // Fix image paths
              html = html.replace(/src="images\//g, `src="${repoBase}/images/`);

              // Backlink to Knowledge Platform
              const backlink = `
                <div style="margin-bottom: 10px;">
                  <a href="${repoBase}/index/" style="font-weight: bold;">← Back to Knowledge Platform</a>
                </div>
              `;

              document.getElementById('panel').innerHTML = `
                ${backlink}
                <h2>${feature.properties.title}</h2>
                ${html}
              `;
            });
        });
      }
    }).addTo(map);

    // Optional: fit map to bounds
    // map.fitBounds(geoLayer.getBounds());
  });
</script>

</body>
</html>
